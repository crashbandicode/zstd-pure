name: Coverage

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  coverage:
    name: cargo-llvm-cov
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: collect coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov test --release --all-features -- \
            --skip compress_roundtrips_across_levels \
            --skip round_trips_three_ways_across_levels \
            --skip frame_is_independent_of_write_chunk_size \
            --skip multi_block_stream_compresses_and_round_trips \
            --skip our_frames_round_trip_through_the_streaming_decoder
          cargo llvm-cov report --release --summary-only | tee coverage-summary.txt
          cargo llvm-cov report --release --lcov --output-path lcov.info
      - name: line coverage % + run summary
        id: cov
        run: |
          pct=$(cargo llvm-cov report --release --json | jq '.data[0].totals.lines.percent')
          printf 'pct=%.1f\n' "$pct" >> "$GITHUB_OUTPUT"
          {
            echo "## Coverage — $(printf '%.2f%%' "$pct") lines"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage-summary.txt
            lcov.info
      # Build the Pages site. Published by the `deploy` job to GitHub Pages — no
      # branch is pushed, so the repo never shows a "compare & pull request"
      # banner. Only main publishes. Layout: the full report lives at /coverage/
      # (with the badge the README embeds at /coverage/badge.svg); the root is a
      # small landing page that just links to the report.
      - name: build Pages site (root landing + /coverage/ report)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site/coverage
          bash scripts/coverage_badge.sh "${{ steps.cov.outputs.pct }}" _site/coverage/badge.svg
          style='font-family:system-ui,sans-serif;max-width:60rem;margin:2rem auto;padding:0 1rem'
          # /coverage/ — the full report (badge + cargo-llvm-cov summary table).
          {
            echo '<!doctype html><meta charset="utf-8"><title>zstd-pure — coverage report</title>'
            echo "<body style=\"$style\">"
            echo '<h1>zstd-pure — coverage report</h1>'
            echo '<p><img src="badge.svg" alt="coverage"> &nbsp; generated by the Coverage workflow (cargo-llvm-cov).</p>'
            echo '<pre style="background:#f6f8fa;padding:1rem;overflow:auto">'
            sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' coverage-summary.txt
            echo '</pre>'
            echo '<p><a href="https://github.com/crashbandicode/zstd-pure">repository &rarr;</a></p>'
            echo '</body>'
          } > _site/coverage/index.html
          # Root — a small landing page whose only content is the coverage report.
          {
            echo '<!doctype html><meta charset="utf-8"><title>zstd-pure</title>'
            echo "<body style=\"$style\">"
            echo '<h1>zstd-pure</h1>'
            echo '<p><a href="coverage/">Coverage report &rarr;</a></p>'
            echo '</body>'
          } > _site/index.html
      - name: upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy badge to Pages
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Serialize Pages deploys without cancelling an in-flight one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
