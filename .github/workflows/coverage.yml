name: Coverage

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: cargo-llvm-cov
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed only to push the regenerated badge to the `badges` branch.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: collect coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov test --release --all-features -- \
            --skip compress_roundtrips_across_levels \
            --skip round_trips_three_ways_across_levels \
            --skip frame_is_independent_of_write_chunk_size \
            --skip multi_block_stream_compresses_and_round_trips \
            --skip our_frames_round_trip_through_the_streaming_decoder
          cargo llvm-cov report --release --summary-only | tee coverage-summary.txt
          cargo llvm-cov report --release --lcov --output-path lcov.info
      - name: line coverage % + run summary
        id: cov
        run: |
          pct=$(cargo llvm-cov report --release --json | jq '.data[0].totals.lines.percent')
          printf 'pct=%.1f\n' "$pct" >> "$GITHUB_OUTPUT"
          {
            echo "## Coverage — $(printf '%.2f%%' "$pct") lines"
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage-summary.txt
            lcov.info
      # Regenerate the badge and force-push it as the sole file on an orphan
      # `badges` branch (kept out of this workflow's triggers, so no loop). The
      # README references it via raw.githubusercontent — no external badge
      # service. Only main updates the published badge.
      - name: publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/coverage_badge.sh "${{ steps.cov.outputs.pct }}" coverage.svg
          work=$(mktemp -d)
          cp coverage.svg "$work/"
          cd "$work"
          git init -q
          git checkout -q -b badges
          git add coverage.svg
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "coverage: ${{ steps.cov.outputs.pct }}% [skip ci]"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:badges
